name: Window Sticker VIN API

description: A free, keyless VIN-lookup service that returns the original factory window sticker (Monroney label) PDF plus an NHTSA vPIC specification
  decode for any 17-character US VIN. Serves decoded vehicle specs, EPA fuel economy, crash ratings, and recalls over an open, CORS-enabled JSON
  API with no registration, no API key and no paid tiers. Factory PDFs are available for 20 makes (Ford, Lincoln, the GM and Stellantis brands, Subaru,
  Kia, Hyundai, Genesis, Toyota and Lexus from model year 2025, and Nissan and Infiniti as Nissan's copy stamped "Unofficial Copy"); every other
  make still returns a full specification decode. A remote MCP server at https://windowsticker.org/mcp exposes the same lookup to agents.

