name: Window Sticker VIN API
description: >-
  A free, keyless VIN-lookup service that returns the original factory window sticker (Monroney label) PDF plus an NHTSA
  vPIC specification decode for any 17-character US VIN. Serves decoded vehicle specs, EPA fuel economy, crash ratings,
  and recalls over an open, CORS-enabled JSON API with no registration, no API key and no paid tiers. Factory PDFs are
  available for 16 makes (Ford, GM, Stellantis, Subaru, Kia, Hyundai, Genesis and more); every other make still returns
  a full specification decode.
